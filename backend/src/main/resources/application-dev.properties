# Local development only. This profile is never selected by the deployment config.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/intervaidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.seed-demo-data=true
app.admin.email=
app.admin.password=
