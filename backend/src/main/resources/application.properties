server.port=${PORT:8080}
spring.profiles.default=dev
server.tomcat.basedir=${SERVER_TOMCAT_BASEDIR:/tmp/tomcat}

# Compress larger API responses to reduce transfer time for interview and analytics payloads.
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Application Details
spring.application.name=intervai-backend

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.ai.rate-limit.max-requests=10
app.ai.rate-limit.window-seconds=60
app.ai.rate-limit.max-tracked-users=10000
app.seed-demo-data=false
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# AI Configuration (Gemini / OpenAI API)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.code-execution.local-fallback-enabled=${CODE_EXECUTION_LOCAL_FALLBACK_ENABLED:true}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.frontend.url=${FRONTEND_URL:}

# Email Delivery Configuration (JavaMailSender / SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging
logging.level.com.intervai=INFO
logging.level.org.springframework.security=WARN

# Hardened Error Handling to prevent CWE-209 Information Exposure
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Multipart File Upload Limits (DoS prevention)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
