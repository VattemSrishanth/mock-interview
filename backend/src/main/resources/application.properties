server.port=${PORT:8080}
spring.profiles.default=prod

# Application Details
spring.application.name=intervai-backend

# Database Configuration (Default: H2 persistent file database for seamless zero-config execution)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/intervaidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.ai.rate-limit.max-requests=10
app.ai.rate-limit.window-seconds=60
app.ai.rate-limit.max-tracked-users=10000
app.seed-demo-data=false
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# AI Configuration (Gemini / OpenAI API)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Logging
logging.level.com.intervai=INFO
logging.level.org.springframework.security=WARN
