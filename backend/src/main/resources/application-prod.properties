# Production configuration
server.tomcat.basedir=${SERVER_TOMCAT_BASEDIR:/tmp/tomcat}

spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

app.jwt.secret=${JWT_SECRET:AxQlNktdZHp7gJmipaqzvL3G0e7x9PYOFCUmKzRNSEs=}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.onrender.com}
app.seed-demo-data=false
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.code-execution.local-fallback-enabled=${CODE_EXECUTION_LOCAL_FALLBACK_ENABLED:true}

# Hardened Error Handling to prevent CWE-209 Information Exposure
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-exception=false

# Multipart File Upload Limits (DoS prevention)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
